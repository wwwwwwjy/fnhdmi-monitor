<!-- FNMONITOR DISPLAY VIEW START -->
<style>
html.fnm-display{zoom:1!important}html.fnm-display body{overflow:hidden}
.fnm-display #topbar,.fnm-display #bottomNav,.fnm-display #layout-overview>.module:not([data-mod="metrics"]){display:none!important}
.fnm-display #page-overview{max-width:none;padding:16px;animation:none;zoom:var(--fnm-display-scale,1)}
.fnm-display #hero{grid-template-columns:132px minmax(0,1fr) 280px;gap:24px;padding:0}
.fnm-display .ring-wrap{width:132px;height:132px}.fnm-display .ring-center .dm{--dm-h:30px}.fnm-display .ring-center .eyebrow{font-size:10px;margin-top:6px}
.fnm-display .verdict{font-size:30px}.fnm-display .greet{margin-bottom:8px}.fnm-display .issues,.fnm-display .facts{margin-top:10px;gap:6px 14px}
.fnm-display .clock-card{padding:16px}.fnm-display .clock-time{font-size:40px}.fnm-display .clock-date{margin-top:6px}
.fnm-display .wx{margin-top:10px;padding-top:10px}.fnm-display .wx-ico,.fnm-display .wx-ico svg{width:34px;height:34px}
.fnm-display #layout-overview>[data-mod="metrics"]{display:block!important;margin-top:16px}
.fnm-display .metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fnm-display .metric{padding:18px;min-height:210px}.fnm-display .metric .m-val{font-size:48px}.fnm-display .metric .m-gauge{width:78px;height:78px}
.fnm-display .metric .m-top{margin-bottom:10px}.fnm-display .metric .m-foot{margin-top:10px;height:36px}
</style>
<script>
(()=>{'use strict';
const root=document.documentElement,storeKey='fnmonitor-hdmi-display-view';let wanted=false,queued;
try{const saved=localStorage.getItem(storeKey);wanted=saved===null?['127.0.0.1','localhost','[::1]'].includes(location.hostname):saved==='1'}catch{}
function fit(){
 const page=document.getElementById('page-overview'),metrics=document.querySelector('[data-mod="metrics"]');
 const active=wanted&&page&&!page.hidden;
 root.classList.toggle('fnm-display',!!active);
 if(!active||!metrics)return;
 // Measure actual cards, including their footer, rather than guessing a browser zoom level.
 let lo=.1,hi=3.0,best=.1;
 for(let i=0;i<12;i++){
  const scale=(lo+hi)/2;root.style.setProperty('--fnm-display-scale',scale);
  const rect=metrics.getBoundingClientRect(),box=page.getBoundingClientRect();
  if(rect.bottom+16*scale<=innerHeight&&box.width<=innerWidth+1){best=scale;lo=scale}else hi=scale;
 }
 root.style.setProperty('--fnm-display-scale',String(Math.floor(best*1000)/1000));
 window.scrollTo(0,0);
}
function schedule(){clearTimeout(queued);queued=setTimeout(fit,80)}
function set(on){wanted=on;try{localStorage.setItem(storeKey,on?'1':'0')}catch{}
 if(on)document.querySelector('#pageSeg [data-page="overview"]')?.click();
 fit();schedule();}
document.addEventListener('keydown',e=>{
 if(e.key!=='F8'&&e.key!=='F9')return;
 e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)set(e.key==='F8');
},true);
addEventListener('resize',schedule);window.visualViewport?.addEventListener('resize',schedule);addEventListener('hashchange',schedule);
document.fonts?.ready.then(schedule);
// Data and fonts arrive after page startup; remeasure without changing saved dashboard settings.
const watch=new MutationObserver(schedule);watch.observe(document.getElementById('page-overview'),{childList:true,subtree:true,characterData:true});
schedule();
})();
</script>
<script src="/display-scene.js"></script>
<!-- FNMONITOR DISPLAY VIEW END -->
