<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞牛HDMI动态监控 · 远程控制</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141820;color:#fff;font:14px system-ui;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;flex:none}button,a{font:inherit;color:inherit;background:#263243;border:1px solid #566078;border-radius:8px;padding:8px 12px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #8cc4ff}#screen{flex:1;min-height:0;overflow:hidden}#msg{flex:1;min-width:180px}button:disabled{opacity:.4}.primary{background:#2462db}#reveal{display:none;position:fixed;top:8px;right:10px;z-index:20;opacity:.3}#reveal:hover,#reveal:focus{opacity:1}body.clean header{display:none}body.clean #reveal{display:block}#notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;background:#202b3aee;border-radius:8px;padding:10px 16px;max-width:90vw;pointer-events:none}#notice[hidden]{display:none}
</style>
<header><a href="/launcher.html">返回控制面板</a><span id="msg" role="status">连接中…</span>
<button id="sceneMonitor">显示飞牛监控</button><button id="sceneHalo">显示 HALOFLUX</button>
<button id="overview" data-remote disabled title="隐藏监控导航，完整显示六张指标卡；NAS 浏览器会记住此选择">一屏总览</button><button id="normal" data-remote disabled>普通页面</button>
<button id="smaller" data-remote disabled title="缩小 NAS 上的网页内容">页面 −</button><button id="larger" data-remote disabled title="放大 NAS 上的网页内容">页面 ＋</button><button id="reset" data-remote disabled>重置缩放</button>
<button id="refresh" data-remote disabled title="升级后先刷新远端网页，让新的显示功能生效">刷新远端</button><button id="cad" data-remote disabled>Ctrl + Alt + Del</button><button id="retry">重新连接</button><button id="full" class="primary">纯画面全屏</button></header>
<button id="reveal" aria-label="显示控制栏">显示控制栏</button><div id="screen"></div><div id="notice" role="status" hidden></div>
<script type="module">
import RFB from '/novnc/core/rfb.js';
const $=id=>document.getElementById(id);let rfb,connected=false,timer;
function tell(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('notice').hidden=true,4500)}
function enabled(on){connected=on;document.querySelectorAll('[data-remote]').forEach(b=>b.disabled=!on)}
function key(sym,code,ctrl=false){if(!connected)return;rfb.focus();if(ctrl)rfb.sendKey(0xffe3,'ControlLeft',true);try{rfb.sendKey(sym,code)}finally{if(ctrl)rfb.sendKey(0xffe3,'ControlLeft',false)}}
function connect(){rfb?.disconnect();$('screen').replaceChildren();$('msg').textContent='正在连接飞牛显示器…';enabled(false);
const current=rfb=new RFB($('screen'),(location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/display/socket');rfb.scaleViewport=true;rfb.resizeSession=false;rfb.viewOnly=false;
current.addEventListener('connect',()=>{if(rfb!==current)return;$('msg').textContent='已连接 · 可以用鼠标和键盘操作';enabled(true);rfb.focus()});
current.addEventListener('disconnect',()=>{if(rfb!==current)return;$('msg').textContent='连接已断开，请确认已登录且远程控制已启动，再重新连接。';enabled(false);document.body.classList.remove('clean')});
current.addEventListener('securityfailure',e=>{if(rfb===current)$('msg').textContent='连接失败：'+(e.detail.reason||'认证未通过')})}
async function scene(mode){try{const r=await fetch('/api/display/scene',{method:'POST',headers:{'Content-Type':'application/json','X-FNM-Request':'1'},body:JSON.stringify({mode})});const j=await r.json();if(!r.ok)throw Error(j.error||'切换失败');tell('已选择'+(mode==='haloflux'?' HALOFLUX':'飞牛监控')+'，等待 NAS 页面切换；首次升级请先点“刷新远端”。')}catch(e){tell(e.message)}}
$('sceneMonitor').onclick=()=>scene('monitor');$('sceneHalo').onclick=()=>scene('haloflux');
$('overview').onclick=()=>{key(0xffc5,'F8');tell('已发送一屏总览指令；升级后首次使用请先点“刷新远端”。')};
$('normal').onclick=()=>key(0xffc6,'F9');
function zoom(sym,code){key(0xffc6,'F9');key(sym,code,true);tell('已切换普通页面并调整远端缩放；“一屏总览”会自动适配屏幕。')}
$('smaller').onclick=()=>zoom(0x2d,'Minus');$('larger').onclick=()=>zoom(0x3d,'Equal');$('reset').onclick=()=>zoom(0x30,'Digit0');
$('refresh').onclick=()=>key(0x72,'KeyR',true);$('cad').onclick=()=>rfb.sendCtrlAltDel();$('retry').onclick=connect;
$('full').onclick=async()=>{document.body.classList.add('clean');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch{tell('控制栏已隐藏；浏览器不允许网页全屏时，可使用浏览器的全屏菜单。')}rfb?.focus()};
$('reveal').onclick=()=>document.body.classList.remove('clean');
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('clean')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('clean')){e.preventDefault();e.stopImmediatePropagation();document.body.classList.remove('clean')}},true);
connect();
</script></html>
